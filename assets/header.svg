<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#7C4DFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C2B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1000" height="280" rx="14" fill="#05080F"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect width="1000" height="280" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="13.5" stroke="#1B2534"/>

  <!-- corner brackets -->
  <path d="M30 48V32a2 2 0 0 1 2-2h16" stroke="#00E5FF" stroke-width="2" opacity="0.7"/>
  <path d="M970 48V32a2 2 0 0 0-2-2h-16" stroke="#7C4DFF" stroke-width="2" opacity="0.7"/>
  <path d="M30 232v16a2 2 0 0 0 2 2h16" stroke="#7C4DFF" stroke-width="2" opacity="0.7"/>
  <path d="M970 232v16a2 2 0 0 1-2 2h-16" stroke="#00E5FF" stroke-width="2" opacity="0.7"/>

  <!-- top meta line -->
  <text x="500" y="72" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="6" fill="#5B6B85">// AI SYSTEMS · EST. 2024</text>

  <!-- name -->
  <text x="500" y="138" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="48" letter-spacing="12" fill="#E9EEF6">DAMA SRI RAM</text>

  <!-- accent underline with scanner -->
  <rect x="380" y="158" width="240" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
  <rect y="158" width="40" height="3" rx="1.5" fill="#FFFFFF" opacity="0.75">
    <animate attributeName="x" values="380;580;380" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>

  <!-- subtitle -->
  <text x="500" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="5" fill="#8A97AB">AI SYSTEMS ENGINEER — RETRIEVAL · AGENTS · BACKEND</text>

  <!-- status -->
  <circle cx="404" cy="228" r="3.5" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="416" y="232" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="#5B6B85">OPEN TO INTERNSHIPS — SUMMER 2026</text>
</svg>
